name: decompile-166
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decomp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install jadx
        run: |
          set -e
          curl -fsSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q jadx.zip -d $HOME/jadx
      - name: Download APK
        run: |
          set -e
          B=https://github.com/bear20252026/linkup-recovery/releases/download/v1.0
          curl -fsSL -O "$B/apk166.part_aa"
          curl -fsSL -O "$B/apk166.part_ab"
          cat apk166.part_aa apk166.part_ab > app.apk
          ls -la app.apk
          md5sum app.apk
      - name: Decompile
        env:
          JAVA_OPTS: -Xmx10g
        run: |
          $HOME/jadx/bin/jadx -d out --no-res -j 4 app.apk || true
          N=$(find out -name '*.java' | wc -l)
          echo "java files: $N"
          [ "$N" -gt 1000 ] || { echo "TOO FEW FILES - decompile failed"; exit 1; }
      - name: Key intelligence
        run: |
          echo "DECOMP_BEGIN"
          echo "== A) 含密钥的文件 =="
          KF=$(grep -rl "be2524844ec4bb25" out --include=*.java | head -6)
          echo "$KF"
          if [ -z "$KF" ]; then echo "(密钥未直接出现, 改找 AES 调用点)"; KF=$(grep -rl "AES/CBC\|Cipher.getInstance" out --include=*.java | head -6); echo "$KF"; fi
          for f in $KF; do echo "----- $f -----"; head -c 10000 "$f"; echo; done
          echo "== B) 提及 Signature 的文件 =="
          grep -rln "Signature" out --include=*.java | head -20
          echo "== C) 域名引用 =="
          grep -rn "51wnl-cq\.com\|tttick\.com" out --include=*.java | head -40
          echo "== D) app_id 公共参数构造 =="
          grep -rn "\"app_id\"" out --include=*.java | head -20
          echo "== E) Retrofit 路由 =="
          grep -rn "@GET\|@POST\|@PUT\|@DELETE" out --include=*.java | head -80
          echo "== F) api 路径字符串 TOP =="
          grep -rhon "\"[^\"]*api/[^\"]*\"" out --include=*.java | sed 's/.*://' | sort | uniq -c | sort -rn | head -60
          echo "DECOMP_END"
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: linkup-166-src
          path: out
          retention-days: 30
