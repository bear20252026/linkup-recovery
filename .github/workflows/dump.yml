name: dump-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download decompiled source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID=$(gh run list -R bear20252026/linkup-recovery -w decompile-166 -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -n linkup-166-src -D src -R bear20252026/linkup-recovery
      - name: Dump login chain
        run: |
          echo "SRC_BEGIN"
          echo "== hm 注解定义 (f/o/t/a) =="
          for x in f o t a; do echo "-- hm/$x.java:"; grep -m2 'interface\|@Target\|@Retention' src/sources/hm/$x.java; head -c 400 src/sources/hm/$x.java | grep -m1 'public'; echo; done
          echo "== sms/send =="
          grep -B4 -A10 '"api/sms/send"' src/sources/gh/a.java
          echo "== user/login =="
          grep -B4 -A14 '"api/user/login"' src/sources/gh/a.java
          echo "== sms/login/cut =="
          grep -B4 -A10 '"api/sms/login/cut"' src/sources/gh/a.java
          echo "== sms/click_to_login =="
          grep -B4 -A10 '"api/sms/click_to_login"' src/sources/gh/a.java
          echo "== gh 包文件清单 =="
          ls src/sources/gh/
          echo "== Retrofit 构建处 =="
          grep -rln 'baseUrl\|Retrofit' src/sources/gh/ | head -5
          echo "SRC_END"
