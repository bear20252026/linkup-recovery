name: dump-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download decompiled source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID=$(gh run list -R bear20252026/linkup-recovery -w decompile-166 -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -n linkup-166-src -D src -R bear20252026/linkup-recovery
      - name: Hunt signature client
        run: |
          echo "SRC_BEGIN"
          echo "== P1 路由字面量所在文件 =="
          P1=$(grep -rln '"api/user/login"' src/sources | head -5); echo "$P1"
          echo "== P2 aes128Encrypt 调用方 =="
          P2=$(grep -rln 'aes128Encrypt' src/sources | head -8); echo "$P2"
          echo "== P3 引号Signature =="
          P3=$(grep -rln '"Signature"' src/sources | head -8); echo "$P3"
          echo "== P4 引用 f1732c 基址的文件 =="
          grep -rln 'f1732c' src/sources | head -10
          echo "== DUMP =="
          for f in $(echo "$P1 $P2 $P3" | tr ' ' '\n' | sort -u | head -14); do echo "----- $f -----"; head -c 22000 "$f"; echo; done
          echo "== STRUCTURE =="
          find src/sources/com/youloft/watcher -maxdepth 1 | sort | head -40
          echo "SRC_END"
