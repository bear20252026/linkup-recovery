name: dump-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download decompiled source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          RID=$(gh run list -R bear20252026/linkup-recovery -w decompile-166 -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -n linkup-166-src -D src -R bear20252026/linkup-recovery
      - name: Dump login body keys
        run: |
          echo "SRC_BEGIN"
          echo "== region 关键词调用方 =="
          (grep -rn '"region"' src/sources/com/youloft/watcher | head -10 || true)
          echo "== 登录相关 map 构建 =="
          (grep -rln 'login' src/sources/com/youloft/watcher/repository src/sources/com/youloft/watcher/manager | head -10 || true)
          (grep -rn -B3 -A12 '"phone"' src/sources/com/youloft/watcher/repository/*.java | head -80 || true)
          echo "== User bean token 字段 =="
          (grep -n 'token\|Token' src/sources/com/youloft/watcher/bean/User.java | head -15 || true)
          echo "== User bean 前40行 =="
          (sed -n '1,40p' src/sources/com/youloft/watcher/bean/User.java || true)
          echo "SRC_END"
