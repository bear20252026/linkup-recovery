name: dump-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download decompiled source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID=$(gh run list -R bear20252026/linkup-recovery -w decompile-166 -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -n linkup-166-src -D src -R bear20252026/linkup-recovery
      - name: Dump constants and client
        run: |
          echo "SRC_BEGIN"
          echo "== utils/a.java (签名实现) =="
          head -c 6000 src/sources/com/youloft/watcher/utils/a.java
          echo; echo "== 常量值 =="
          echo "-- v2.a.f80749y:"; grep -A1 'f80749y' src/sources/v2/a.java | head -4
          echo "-- vf.f.f81235e:"; grep -A1 'f81235e' src/sources/vf/f.java | head -4
          echo "-- bv.aI:"; grep -A1 ' aI' src/sources/com/umeng/analytics/pro/bv.java | head -4
          echo "-- f4.k.f69891c:"; grep -B1 -A1 'f69891c' src/sources/f4/k.java | head -6
          echo "-- ve.f.f81194d:"; grep -A1 'f81194d' src/sources/ve/f.java | head -4
          echo "== gh/a.java (API客户端) =="
          head -c 24000 src/sources/gh/a.java
          echo; echo "SRC_END"
