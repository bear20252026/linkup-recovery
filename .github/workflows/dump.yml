name: dump-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download decompiled source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          RID=$(gh run list -R bear20252026/linkup-recovery -w decompile-166 -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RID" -n linkup-166-src -D src -R bear20252026/linkup-recovery
      - name: Dump login caller
        run: |
          echo "SRC_BEGIN"
          echo "== datasource/a.java 680-780 (登录map上下文) =="
          (sed -n '680,780p' src/sources/com/youloft/watcher/datasource/a.java || true)
          echo "== repository/c.java login 相关 =="
          (grep -n -B5 -A20 'login' src/sources/com/youloft/watcher/repository/c.java | head -100 || true)
          echo "== kj/b.java typeId 枚举 =="
          (head -c 3000 src/sources/kj/b.java || true)
          echo "SRC_END"
