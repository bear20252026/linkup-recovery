name: probe4-sms-send
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sms or login'
        required: true
        default: 'sms'
      code:
        description: 'sms code (login mode only)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pycryptodome
      - run: python tools/probe_login.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.code }}"
